
name: Update Learning Progress

on:
  schedule:
    - cron: "0 0 */5 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate progress bar
        run: python scripts/generate_progress.py

      - name: Commit updated progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/learning-progress.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update Python learning progress"
            git push
          else
            echo "Progress hasn't changed. Skipping commit."
          fi
